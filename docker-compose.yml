services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: jokes-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - jokes-network

    nginx:
        image: nginx:alpine
        container_name: jokes-nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - jokes-network

    mysql:
        image: mysql:8.0
        container_name: jokes-mysql
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: jokes
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: jokes
            MYSQL_PASSWORD: secret
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - jokes-network

    node:
        image: node:20-alpine
        container_name: jokes-node
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - jokes-network

networks:
    jokes-network:
        driver: bridge

volumes:
    mysql-data:
